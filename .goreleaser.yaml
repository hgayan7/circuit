version: 2

project_name: circuit

builds:
  - id: circuit
    binary: circuit
    main: ./cmd/circuit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - circuit.yaml
      - docs/**
      - deploy/docker/**

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: .circuit/release-sdk/*

release:
  draft: true
  prerelease: auto
  extra_files:
    - glob: .circuit/release-sdk/*
  header: |
    Circuit is a self-hosted BYOK action gateway with exact approvals, durable
    budgets and audit, an operator UI, and gateway-owned provider credentials.
    The setup -> up -> agent run flow provides tested gateway-only Docker/runc
    isolation. Governed REST routes, MCP tools, plugins, and GitHub are supported.

    Linux/macOS amd64/arm64 binaries, deployment templates, an OpenAPI contract,
    and installable Python/TypeScript/Go SDK archives are included in this repository.
    No npm/PyPI, Homebrew, or container-registry publication is performed.
    For Docker builds and rehearsal scripts, use the source checkout for this tag.
    Supply your own protected credentials; no production secrets are bundled.

    The owner waived the 72-hour soak on 2026-10-05; it has not passed.
    Independent security review remains deferred. Intended-provider/workload,
    email/storage, and separate-host recovery acceptance remain the operator's duty.
    A stable version is not independent production certification.
    See [the release checklist](https://github.com/hgayan7/circuit/blob/{{ .Tag }}/docs/release-checklist.md).

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: circuit
    skip_upload: true
    repository:
      owner: hgayan7
      name: homebrew-circuit
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://circuitproxy.com"
    binaries:
      - circuit
