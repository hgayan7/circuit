groups:
  - name: circuit
    rules:
      - alert: CircuitUnavailable
        expr: up{job="circuit"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Circuit metrics endpoint is unavailable
      - alert: CircuitUncertainAction
        expr: circuit_actions{state="uncertain"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An action requires provider evidence and operator reconciliation
      - alert: CircuitStorageUnavailable
        expr: circuit_storage_unavailable == 1
        labels:
          severity: critical
        annotations:
          summary: Dispatch is stopped after a state storage failure
      - alert: CircuitRestorePending
        expr: circuit_restore_pending == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Restored state remains paused pending provider reconciliation
      - alert: CircuitFailedAction
        expr: delta(circuit_actions{state="failed"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A provider action failed; inspect the protected action history
      - alert: CircuitServerErrors
        expr: increase(circuit_http_errors_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Circuit returned server errors; inspect sanitized logs and state storage
      - alert: CircuitBackupStale
        expr: time() - circuit_worker_last_success_unix{job="circuit_backup"} > 7200
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A verified encrypted backup has not succeeded in two hours
      - alert: CircuitBackupFailed
        expr: increase(circuit_worker_failures_total{job="circuit_backup"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: Scheduled backup or retention failed
      - alert: CircuitBackupWorkerUnavailable
        expr: up{job="circuit_backup"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The encrypted backup worker is unavailable
      - alert: CircuitSoakFailed
        expr: circuit_worker_failures_total{job="circuit_soak"} > 0
        labels:
          severity: warning
        annotations:
          summary: Fixture soak recorded a failed read or continuity gap
      - alert: CircuitArchiveStale
        expr: time() - circuit_archive_last_success_unix{job="circuit_archive"} > 7200
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Encrypted remote archive readback has not succeeded in two hours
      - alert: CircuitArchiveUnavailable
        expr: up{job="circuit_archive"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The remote archive worker is unavailable
      - alert: CircuitArchiveFailed
        expr: increase(circuit_archive_failures_total{job="circuit_archive"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: Remote archive upload or full readback verification failed
      - alert: CircuitDiskCapacityLow
        expr: circuit_filesystem_available_bytes / circuit_filesystem_size_bytes < 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Circuit filesystem capacity is below ten percent
      - alert: CircuitStateDiskReserveLow
        expr: circuit_filesystem_available_bytes{volume=~"state|backups"} < 536870912
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Circuit state or backup filesystem has less than 512 MiB available
      - alert: CircuitFilesystemProbeFailed
        expr: circuit_filesystem_probe_success == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Circuit cannot inspect filesystem capacity
      - alert: CircuitCertificateExpiring
        expr: circuit_tls_certificate_expiry_unix - time() < 604800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: The active gateway TLS certificate expires within seven days
