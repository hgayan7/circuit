name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  postgres:
    name: Live PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: circuit_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: circuit_validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise real database and MCP
        env:
          CIRCUIT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=circuit_fixture password=fixture-only dbname=circuit_validation sslmode=disable
        run: go test -race -v ./pkg/gateway -run TestPostgresLive -count=1

  security:
    name: Reachable Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker-recovery:
    name: Docker Build and Disk-Full Recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build restricted gateway image
        run: docker build --target gateway -f deploy/docker/Dockerfile -t circuit-ci .
      - name: Compile offline storage failure fixture
        env:
          CGO_ENABLED: '0'
        run: go test -c -o /tmp/gateway-storage.test ./pkg/gateway
      - name: Exercise real ENOSPC without host disk exhaustion
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --tmpfs /state:rw,noexec,nosuid,size=2m,uid=10001,gid=10001
          -e CIRCUIT_DISK_FULL_TEST=1
          -v /tmp/gateway-storage.test:/tool/gateway.test:ro
          --entrypoint /tool/gateway.test circuit-ci
          -test.run '^TestDiskFullStorageHelper$' -test.v

  build-matrix:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    needs: [test, postgres, security, docker-recovery]
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -o bin/circuit-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/circuit

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/circuit-${{ matrix.goos }}-${{ matrix.goarch }}
