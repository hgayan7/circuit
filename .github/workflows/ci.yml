name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...
      - name: Rehearse guided setup and agent-only stdio MCP connection
        run: python3 examples/onboarding-validation.py
      - name: Rehearse guided middleware setup and real REST approval forwarding
        run: python3 examples/middleware-validation.py
      - name: Verify movie booking consent and autonomous workflow
        run: |
          python3 -m unittest discover -s examples/movie-booking -p 'test_*.py' -v
          python3 examples/movie-booking/demo.py

  postgres:
    name: Live PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: circuit_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: circuit_validation
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise real database and MCP
        env:
          CIRCUIT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=circuit_fixture password=fixture-only dbname=circuit_validation sslmode=disable
        run: go test -race -v ./pkg/gateway -run TestPostgresLive -count=1

  security:
    name: Reachable Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker-recovery:
    name: Docker Build and Disk-Full Recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build restricted gateway image
        run: docker build --target gateway -f deploy/docker/Dockerfile -t circuit-ci .
      - name: Rehearse optional Docker runner with scoped MCP and interruption cleanup
        run: python3 examples/sandbox-validation.py --image circuit-ci
      - name: Build trusted network namespace boundary
        run: docker build --target boundary -f deploy/docker/Dockerfile -t circuit-boundary-ci .
      - name: Rehearse mandatory gateway-only namespace and approved REST execution
        run: python3 examples/isolated-validation.py --gateway-image circuit-ci --boundary-image circuit-boundary-ci
      - name: Build separate operator worker image
        run: docker build --target operations -f deploy/docker/Dockerfile -t circuit-operations-ci .
      - name: Build replaceable storage backend image
        run: docker build --target archive -f deploy/docker/Dockerfile -t circuit-archive-ci .
      - name: Exercise authenticated S3 transfer and independent copy recovery
        run: python3 examples/archive-validation.py --image circuit-archive-ci
      - name: Validate operational alert rules
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          -v "$PWD/deploy/docker/alerts.example.yaml:/etc/alerts.yaml:ro"
          --entrypoint /bin/promtool
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          check rules /etc/alerts.yaml
      - name: Compile offline storage failure fixture
        env:
          CGO_ENABLED: '0'
        run: go test -c -o /tmp/gateway-storage.test ./pkg/gateway
      - name: Test capacity and certificate alert behavior
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --tmpfs /tmp:rw,noexec,nosuid,size=32m
          -v "$PWD/deploy/docker:/rules:ro" -w /rules
          --entrypoint /bin/promtool
          prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          test rules alerts.test.yaml
      - name: Exercise real ENOSPC without host disk exhaustion
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --tmpfs /state:rw,noexec,nosuid,size=2m,uid=10001,gid=10001
          -e CIRCUIT_DISK_FULL_TEST=1
          -v /tmp/gateway-storage.test:/tool/gateway.test:ro
          --entrypoint /tool/gateway.test circuit-ci
          -test.run '^TestDiskFullStorageHelper$' -test.v

  sdk:
    name: Generated SDK Contract and Live TLS Clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Regenerate bindings and reject contract drift
        run: |
          sh scripts/generate-sdks.sh
          git diff --exit-code -- sdk
      - name: Build client packages
        run: |
          npm ci --prefix sdk/typescript
          python3 -m venv /tmp/circuit-sdk-venv
          /tmp/circuit-sdk-venv/bin/pip install ./sdk/python
          cd sdk/go
          go test ./...
      - name: Rehearse all generated clients against actual gateway
        run: python3 examples/sdk-validation.py --python /tmp/circuit-sdk-venv/bin/python
      - name: Install packed artifacts in clean consumer environments
        run: |
          go build -ldflags '-X main.version=0.3.0-local' -o /tmp/circuit-candidate ./cmd/circuit
          sh scripts/package-sdks.sh .circuit/release-sdk
          python3 examples/release-validation.py --artifacts .circuit/release-sdk --binary /tmp/circuit-candidate
      - name: Rehearse previous-release upgrade and rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            gh release download v0.2.0 --pattern circuit_0.2.0_linux_amd64.tar.gz --pattern checksums.txt --dir /tmp/circuit-previous --clobber && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
          cd /tmp/circuit-previous
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf circuit_0.2.0_linux_amd64.tar.gz
          cd "$GITHUB_WORKSPACE"
          python3 examples/compatibility-validation.py --previous /tmp/circuit-previous/circuit --candidate /tmp/circuit-candidate

  build-matrix:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    needs: [test, postgres, security, docker-recovery, sdk]
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -o bin/circuit-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/circuit

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/circuit-${{ matrix.goos }}-${{ matrix.goarch }}
