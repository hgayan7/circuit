name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  goreleaser:
    name: Validate and Release Repository Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require successful CI for the exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion,status,headSha > /tmp/release-ci.json
          python3 -c 'import json; runs=json.load(open("/tmp/release-ci.json")); assert any(r["status"]=="completed" and r["conclusion"]=="success" for r in runs), "Release requires green main CI for this exact commit"'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: 'v2.18.2'
          args: check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build installable SDK archives
        run: sh scripts/package-sdks.sh .circuit/release-sdk
      - name: Build draft repository release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: 'v2.18.2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: unused-no-external-publication
      - name: Verify and test exact downloadable artifacts before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3; do
            gh release download "$GITHUB_REF_NAME" --dir /tmp/circuit-release --clobber && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
          cd /tmp/circuit-release
          sha256sum -c checksums.txt
          tar -xzf "circuit_${version}_linux_amd64.tar.gz"
          cd "$GITHUB_WORKSPACE"
          python3 examples/release-validation.py --artifacts /tmp/circuit-release --binary /tmp/circuit-release/circuit --expected-version "$version"
          docker build --target gateway -f deploy/docker/Dockerfile -t circuit-release-fixture .
          docker build --target boundary -f deploy/docker/Dockerfile -t circuit-release-boundary .
          python3 examples/isolated-validation.py --binary /tmp/circuit-release/circuit --gateway-image circuit-release-fixture --boundary-image circuit-release-boundary
      - name: Publish validated release in this repository only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
