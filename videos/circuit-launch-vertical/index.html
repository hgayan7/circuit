<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #10141c;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.6"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-problem"
        class="scene"
        data-composition-id="01-problem"
        data-composition-src="compositions/frames/01-problem.html"
        data-start="0"
        data-duration="7.8"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-problem-voice"
        src="assets/voice/1.wav"
        data-start="0"
        data-duration="7.8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-boundary"
        class="scene"
        data-composition-id="02-boundary"
        data-composition-src="compositions/frames/02-boundary.html"
        data-start="7.8"
        data-duration="7"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-boundary-voice"
        src="assets/voice/2.wav"
        data-start="7.8"
        data-duration="7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-checks"
        class="scene"
        data-composition-id="03-checks"
        data-composition-src="compositions/frames/03-checks.html"
        data-start="14.8"
        data-duration="8.4"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-checks-voice"
        src="assets/voice/3.wav"
        data-start="14.8"
        data-duration="8.4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-execution"
        class="scene"
        data-composition-id="04-execution"
        data-composition-src="compositions/frames/04-execution.html"
        data-start="23.200000000000003"
        data-duration="9.2"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-execution-voice"
        src="assets/voice/4.wav"
        data-start="23.200000000000003"
        data-duration="9.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-close"
        class="scene"
        data-composition-id="05-close"
        data-composition-src="compositions/frames/05-close.html"
        data-start="32.400000000000006"
        data-duration="8.2"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-close-voice"
        src="assets/voice/5.wav"
        data-start="32.400000000000006"
        data-duration="8.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions" data-track-kind="captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="40.6"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
