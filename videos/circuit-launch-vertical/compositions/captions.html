<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      @font-face { font-family: 'Space Grotesk'; src: url('assets/fonts/spacegrotesk.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: 'Inter'; src: url('assets/fonts/inter.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: block; }
      :root {
      --bg: #10141c;
      --primary: #f4b942;
      --text: #e9edf3;
      --text-muted: #aab5c5;
      --text-light: #9A9A9A;
      --accent-light: rgba(244, 185, 66, 0.08);
      --accent-medium: rgba(244, 185, 66, 0.15);
      --border: rgba(244, 185, 66, 0.2);
      --card-bg: rgba(244, 185, 66, 0.04);
      --positive: #059669;
      --negative: #dc2626;
      --cap-ink: #e9edf3;
      --cap-canvas: #10141c;
      --cap-accent: #f4b942;
      --cap-accent-2: #aab5c5;
      --font-display: "Space Grotesk", system-ui, serif;
      --font-body: "Inter", system-ui, sans-serif;
      --cap-band-top: 1600px;
      --cap-band-height: 320px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE tinted card — 4% cobalt fill, 1.5px 20%-cobalt border, soft 14px corners,
     NO shadow (the tinted card does the lift; cast depth is forbidden) */
  .caption-pill {
    max-width: 78%;
    padding: 20px 44px 24px;
    background: color-mix(in srgb, var(--cap-accent, #1e2bfa) 4%, var(--cap-canvas, #fdfae7));
    border: 1.5px solid color-mix(in srgb, var(--cap-accent, #1e2bfa) 20%, transparent);
    border-radius: 14px;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.02em;
  }

  /* upcoming — muted gray, no chip */
  .caption-word {
    display: inline-block;
    padding: 0 0.18em;
    border-radius: 0.32em;
    color: color-mix(in srgb, var(--cap-ink, #111111) 75%, var(--cap-canvas, #fdfae7));
  }
  /* current word — THE solid cobalt chip (the single-accent gesture; pill-rounded
     fill, NO shadow), cream reading on top */
  .caption-word.is-active {
    color: var(--cap-canvas, #fdfae7);
    background: var(--cap-accent, #1e2bfa);
    box-shadow: none;
  }
  /* already spoken — solid near-black ink, chip cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #111111);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — cobalt, the system's one accent on a key word */
  .caption-word.cap-brand {
    color: var(--cap-accent, #1e2bfa);
  }
  /* numerals / data — cobalt 700, the figure voice */
  .caption-word.cap-num {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    color: var(--cap-accent, #1e2bfa);
  }
  /* emphasis — a directional-red hairline underline (inline only, never a fill) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #dc2626);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="27"
  data-fps="30"
  data-width="1080"
  data-height="1920"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

"text":"circuit","start":17.63,"end":18.07},{"id":"caption-word-17-1","text":"executes","start":18.12,"end":18.64},{"id":"caption-word-17-2","text":"and","start":18.64,"end":18.82},{"id":"caption-word-17-3","text":"records","start":18.82,"end":19.2}]},{"id":"caption-group-18","frame":4,"start":19.26,"end":19.97,"text":"the result.","words":[{"id":"caption-word-18-0","text":"the","start":19.26,"end":19.43},{"id":"caption-word-18-1","text":"result.","start":19.43,"end":19.85}]},{"id":"caption-group-19","frame":5,"start":21.28,"end":22.52,"text":"Keep agents moving.","words":[{"id":"caption-word-19-0","text":"Keep","start":21.28,"end":21.51},{"id":"caption-word-19-1","text":"agents","start":21.51,"end":21.97},{"id":"caption-word-19-2","text":"moving.","start":21.97,"end":22.44}]},{"id":"caption-group-20","frame":5,"start":22.52,"end":23.2,"text":"Keep control,","words":[{"id":"caption-word-20-0","text":"Keep","start":22.52,"end":22.67},{"id":"caption-word-20-1","text":"control,","start":22.67,"end":23.2}]},{"id":"caption-group-21","frame":5,"start":23.2,"end":24,"text":"tri-circuit,","words":[{"id":"caption-word-21-0","text":"tri-circuit,","start":23.2,"end":24}]},{"id":"caption-group-22","frame":5,"start":24,"end":25.01,"text":"open source,","words":[{"id":"caption-word-22-0","text":"open","start":24,"end":24.32},{"id":"caption-word-22-1","text":"source,","start":24.32,"end":24.93}]},{"id":"caption-group-23","frame":5,"start":25.01,"end":26.12,"text":"self-hosted.","words":[{"id":"caption-word-23-0","text":"self-hosted.","start":25.01,"end":26}]}];
  var DURATION = 27;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.18, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }

      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
