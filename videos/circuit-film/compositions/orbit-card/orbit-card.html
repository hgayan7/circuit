    <script type="module">
      import { createOrbitScene } from "orbit-card/scene";
      // Bare __hyperframes is this composition's own in a module.
      const renderAt = createOrbitScene(
        (typeof __hyperframes !== "undefined" && __hyperframes.getVariables?.()) || {},
      );
      const state = { time: 0 };
      const timeline = gsap.timeline({ paused: true });
      timeline.to(state, {
        time: 7,
        duration: 7,
        ease: "none",
        onUpdate: () => renderAt(state.time * 1.22),
      });
      window.addEventListener("hf-seek", (event) => {
        if (typeof event.detail?.time === "number") {
          timeline.totalTime(Math.max(0, Math.min(7, event.detail.time - 10)), true);
          renderAt(Math.max(0, Math.min(7, event.detail.time - 10)) * 1.22);
        }
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["orbit-card"] = timeline;
      const query = new URLSearchParams(location.search);
      if (query.has("play")) {
        timeline.repeat(query.has("loop") ? 999 : 0);
        timeline.play(0);
      }
